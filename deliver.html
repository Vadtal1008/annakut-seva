<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deliveries">
<title>Prasad Delivery</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--m9:#33070f;--m7:#721325;--gold:#d4a64a;--gold-l:#f6e2a4;--ivory:#fdf8ef;--ink:#2b1a12;--muted:#6f5d50;--line:#ecdfc9;--ok:#2e7d4f;--warn:#b26a00;color-scheme:light}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:Poppins,system-ui,sans-serif;line-height:1.45}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
header{background:linear-gradient(180deg,var(--m7),var(--m9));color:var(--gold-l);padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:5;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:1.05rem;flex:1}
header button{background:rgba(255,255,255,.12);border:1px solid rgba(212,166,74,.7);color:var(--gold-l);border-radius:999px;padding:6px 12px}
main{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px -18px rgba(51,7,15,.35);margin-bottom:14px}
.big{width:100%;min-height:56px;border:0;border-radius:14px;font-weight:600;font-size:1.05rem;margin-top:10px}
.go{background:#0a7cff;color:#fff}.done{background:var(--ok);color:#fff}.nh{background:#fff;color:var(--warn);border:2px solid var(--warn)!important}
.row2{display:flex;gap:10px}.row2 .big{flex:1}
input{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;min-height:52px}
.seg{display:flex;gap:8px;margin:10px 0}.seg button{flex:1;min-height:52px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:600}
.seg button[aria-pressed=true]{border-color:var(--m7);background:var(--m7);color:#fff}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.muted{color:var(--muted);font-size:.9rem}
.name{font-size:1.3rem;font-weight:700;margin:2px 0}
.addr{font-size:1.05rem}
.note{background:#fff6e0;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.95rem}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.list .n{min-width:30px;font-weight:700;color:var(--m7)}
.list .it div{flex:1;min-width:0}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap}
.tag.Excluded{background:#eee;color:#555}.tag.Delivered{background:#dff2e6;color:var(--ok)}.tag.Not{background:#fdebd3;color:var(--warn)}
a{color:var(--m7)}
.small{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.85rem}
</style>
</head>
<body>
<header><h1 id="title">Calendar &amp; Prasad Delivery</h1><button id="refresh" hidden>Refresh</button></header>
<main>
  <form class="card" id="login">
    <p style="margin-top:0">Organizer PIN</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="Organizer PIN">
    <p style="margin-bottom:0">Which driver are you?</p>
    <div class="seg"><button type="button" data-d="1" aria-pressed="false">Driver 1</button><button type="button" data-d="2" aria-pressed="false">Driver 2</button></div>
    <input id="who" placeholder="Your name" autocomplete="name" aria-label="Your name">
    <button class="big go">Start</button>
    <p class="muted" id="lerr" role="status"></p>
  </form>
  <div id="app" hidden>
    <div class="card"><b id="prog"></b><div class="bar"><i id="pbar"></i></div><div class="muted" id="prog2"></div></div>
    <div class="card" id="next"></div>
    <div class="card list"><div style="display:flex;justify-content:space-between;align-items:center"><b>Route</b><button class="small" id="all">Show other driver too</button></div><div id="list"></div></div>
  </div>
</main>
<script>
const API = 'https://script.google.com/macros/s/AKfycbyRY0_dSN0dptVP5b5wbytYk2CkH3DB-amCWZSygSmlWHoijpe9dImNG6Vr9V_ds9kA/exec';
const TEMPLE = { lat: 53.4776, lng: -113.4818, address: '4133 98 St NW, Edmonton, AB' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let PIN = '', DRIVER = store.get('drv'), WHO = store.get('who'), stops = [], showAll = false;

async function api(fn, args) {
  const r = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ fn, args }) })).json();
  if (!r.ok) throw new Error(r.error || 'Error');
  return r.data;
}
const km = (a, b) => { const p = Math.PI / 180, h = Math.sin((b.lat - a.lat) * p / 2) ** 2 + Math.cos(a.lat * p) * Math.cos(b.lat * p) * Math.sin((b.lng - a.lng) * p / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); };
const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'America/Edmonton' });
// Not home from an earlier day goes back into today's route; not home today waits until tomorrow.
const todo = s => s.status === 'Pending' || (s.status === 'Not home' && !s.updated.startsWith(today + ' '));

// shortcut: straight-line nearest neighbour + 2-opt, not road distances; good enough inside one city.
function route(start, pts) {
  const left = pts.filter(p => p.lat), out = [];
  let cur = start;
  while (left.length) { let bi = 0; left.forEach((p, i) => { if (km(cur, p) < km(cur, left[bi])) bi = i; }); cur = left.splice(bi, 1)[0]; out.push(cur); }
  for (let improved = true, n = 0; improved && n < 50; n++) {
    improved = false;
    for (let i = 0; i < out.length - 1; i++) for (let j = i + 1; j < out.length; j++) {
      const a = i ? out[i - 1] : start, b = out[i], c = out[j], d = out[j + 1];
      if (km(a, c) + (d ? km(b, d) : 0) < km(a, b) + (d ? km(c, d) : 0) - 1e-9) { out.splice(i, j - i + 1, ...out.slice(i, j + 1).reverse()); improved = true; }
    }
  }
  return out.concat(pts.filter(p => !p.lat));
}
// Start from the last stop marked today by this driver, otherwise the temple.
function startPoint(mine) {
  const t = mine.filter(s => s.status !== 'Pending' && s.updated.startsWith(today + ' ') && s.lat);
  const mins = u => { const m = u.match(/(\d+):(\d+) ([AP]M)$/i); return m ? (m[1] % 12 + (/p/i.test(m[3]) ? 12 : 0)) * 60 + +m[2] : 0; };
  return t.length ? t.sort((a, b) => mins(b.updated) - mins(a.updated))[0] : TEMPLE;
}
const maps = a => 'https://maps.apple.com/?daddr=' + encodeURIComponent(a) + '&dirflg=d';

function render() {
  const live = stops.filter(s => s.status !== 'Excluded');
  const mine = live.filter(s => s.driver === DRIVER);
  const done = mine.filter(s => s.status === 'Delivered').length;
  $('prog').textContent = `Driver ${DRIVER}: ${done} of ${mine.length} delivered`;
  $('pbar').style.width = (mine.length ? 100 * done / mine.length : 0) + '%';
  const all = live.filter(s => s.status === 'Delivered').length, ex = stops.length - live.length;
  $('prog2').textContent = `Everyone: ${all} of ${live.length} delivered · ${live.filter(s => !s.driver).length} out of town` + (ex ? ` · ${ex} excluded` : '');
  const pool = showAll ? stops.filter(s => s.driver) : stops.filter(s => s.driver === DRIVER);
  const order = route(startPoint(mine), pool.filter(todo));
  const nx = order[0];
  $('next').innerHTML = nx ? `<div class="muted">Next stop${nx.driver !== DRIVER ? ' (Driver ' + nx.driver + ')' : ''} · ${order.length} left today</div>
    <div class="name">${esc(nx.name)}</div><div class="addr">${esc(nx.address)}</div>
    ${nx.phone ? `<div style="margin-top:6px"><a href="tel:${esc(nx.phone)}">Call ${esc(nx.phone)}</a></div>` : ''}
    ${nx.notes ? `<div class="note">${esc(nx.notes)}</div>` : ''}<div class="muted" style="margin-top:6px">${esc(nx.from)}</div>
    <a href="${maps(nx.address)}" style="text-decoration:none"><button class="big go">Navigate in Apple Maps</button></a>
    <div class="row2"><button class="big done" data-mark="Delivered" data-id="${esc(nx.id)}">Delivered</button><button class="big nh" data-mark="Not home" data-id="${esc(nx.id)}">Not home</button></div>
    <button class="small" style="margin-top:12px" data-mark="Excluded" data-id="${esc(nx.id)}">Exclude from list (duplicate / not needed)</button>`
    : `<div class="name">All done for today 🙏</div><div class="muted">Stops marked Not home today come back on tomorrow's route.</div>
    <a href="${maps(TEMPLE.address)}" style="text-decoration:none"><button class="big go">Navigate back to the temple</button></a>`;
  const rest = pool.filter(s => !todo(s));
  $('list').innerHTML = order.map((s, i) => `<div class="it"><span class="n">${i + 1}</span><div><b>${esc(s.name)}</b>${s.driver !== DRIVER ? ' <span class="tag">Driver ' + esc(s.driver) + '</span>' : ''}<br><span class="muted">${esc(s.address)}</span></div><div style="display:flex;flex-direction:column;gap:6px"><a class="small" href="${maps(s.address)}">Go</a><button class="small" data-mark="Excluded" data-id="${esc(s.id)}">Exclude</button></div></div>`).join('')
    + rest.map(s => `<div class="it"><span class="n">✓</span><div><b>${esc(s.name)}</b> <span class="tag ${esc(s.status.split(' ')[0])}">${esc(s.status)}</span>${s.wa ? ` <span class="tag">WhatsApp: ${esc(s.wa)}</span>` : ''}<br><span class="muted">${esc(s.address)} · ${esc(s.updated)} ${esc(s.by)}</span></div><button class="small" data-mark="Pending" data-id="${esc(s.id)}">Undo</button></div>`).join('');
}

async function load() {
  stops = await api('delList', [PIN]);
  render();
}

document.querySelectorAll('.seg button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.d === DRIVER); b.onclick = () => { DRIVER = b.dataset.d; document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); }; });
$('who').value = WHO;
$('login').onsubmit = async e => {
  e.preventDefault();
  PIN = $('pin').value.trim(); WHO = $('who').value.trim();
  if (!DRIVER) { $('lerr').textContent = 'Choose Driver 1 or Driver 2.'; return; }
  $('lerr').textContent = 'Loading...';
  try { await load(); } catch (x) { $('lerr').textContent = x.message === 'Not allowed.' ? 'Wrong PIN.' : x.message; return; }
  store.set('drv', DRIVER); store.set('who', WHO);
  try { sessionStorage.setItem('orgpin', PIN); } catch {}
  $('login').hidden = true; $('app').hidden = false; $('refresh').hidden = false;
  setInterval(() => load().catch(() => {}), 60000);  // see the other driver's progress
};
$('refresh').onclick = () => load().catch(x => alert(x.message));
$('all').onclick = () => { showAll = !showAll; $('all').textContent = showAll ? 'Only my stops' : 'Show other driver too'; render(); };
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-mark]'); if (!b) return;
  const s = stops.find(x => x.id === b.dataset.id); if (!s) return;
  if (b.dataset.mark === 'Excluded' && !confirm(`Exclude ${s.name} from the delivery list? You can undo it later.`)) return;
  b.disabled = true;
  const prev = [s.status, s.updated, s.by, s.wa];
  s.wa = b.dataset.mark === 'Delivered' ? (s.wa || 'Pending') : (s.wa === 'Pending' ? '' : s.wa);
  s.status = b.dataset.mark; s.updated = s.status === 'Pending' ? '' : today + ' ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); s.by = WHO;
  render();
  try { await api('delMark', [PIN, s.id, s.status, WHO]); }
  catch (x) { [s.status, s.updated, s.by, s.wa] = prev; render(); alert('Not saved, please try again: ' + x.message); }
});
try { const p = sessionStorage.getItem('orgpin'); if (p && DRIVER) { $('pin').value = p; $('login').requestSubmit(); } } catch {}
</script>
</body>
</html>
