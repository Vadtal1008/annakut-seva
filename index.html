<title>Annakut Seva 2026 — Vadtal Dham Edmonton</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Jost:wght@300;400;500;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">

<style>
/* ─── Tokens — warm white + aged gold ─────────────── */
:root {
  --bg:        #FFFDF8;
  --bg-alt:    #F7F3EA;
  --surface:   #FFFFFF;
  --surface2:  #F9F6EF;
  --border:    rgba(140,105,30,0.13);
  --border-h:  rgba(140,105,30,0.32);
  --sh:        0 2px 8px rgba(80,55,10,0.07), 0 6px 22px rgba(80,55,10,0.05);
  --sh-lg:     0 8px 36px rgba(80,55,10,0.11);
  --fg:        #1A1208;
  --fg-2:      #4A3A1E;
  --fg-muted:  #7A6848;
  --gold:      #A87818;
  --gold-lt:   #D4A030;
  --gold-dim:  rgba(168,120,24,0.08);
  --saffron:   #C04C0E;
  --avail:     #1E7040;
  --avail-bg:  rgba(30,112,64,0.08);
  --booked-c:  #8B2020;
  --booked-bg: rgba(139,32,32,0.08);
  --font-disp: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Jost', 'Noto Sans Gujarati', 'Noto Sans Devanagari', sans-serif;
  --r:    6px;
  --r-sm: 4px;
  --hh:   66px;
}
/* Lighter dark mode */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1C1509;--bg-alt:#241C0C;--surface:#2C2210;--surface2:#342A16;
    --border:rgba(225,175,55,0.13);--border-h:rgba(225,175,55,0.33);
    --sh:0 2px 8px rgba(0,0,0,0.35),0 6px 22px rgba(0,0,0,0.25);
    --sh-lg:0 8px 36px rgba(0,0,0,0.45);
    --fg:#F0E6CC;--fg-2:#CEAE78;--fg-muted:#9A8860;
    --gold:#E0B840;--gold-lt:#F8D460;--gold-dim:rgba(224,184,64,0.08);
    --saffron:#DC6820;--avail:#72CC8A;--avail-bg:rgba(114,204,138,0.09);
    --booked-c:#D05050;--booked-bg:rgba(208,80,80,0.09);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#1C1509;--bg-alt:#241C0C;--surface:#2C2210;--surface2:#342A16;
  --border:rgba(225,175,55,0.13);--border-h:rgba(225,175,55,0.33);
  --sh:0 2px 8px rgba(0,0,0,0.35),0 6px 22px rgba(0,0,0,0.25);
  --sh-lg:0 8px 36px rgba(0,0,0,0.45);
  --fg:#F0E6CC;--fg-2:#CEAE78;--fg-muted:#9A8860;
  --gold:#E0B840;--gold-lt:#F8D460;--gold-dim:rgba(224,184,64,0.08);
  --saffron:#DC6820;--avail:#72CC8A;--avail-bg:rgba(114,204,138,0.09);
  --booked-c:#D05050;--booked-bg:rgba(208,80,80,0.09);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.65;min-height:100%}
[hidden]{display:none!important}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--font-disp);text-wrap:balance;line-height:1.12}

/* ── Header ──────────────────────────────────────── */
.site-header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:100;
  background:var(--bg);border-bottom:2px solid var(--border);
  padding:0 max(20px,env(safe-area-inset-left,0px));
  height:var(--hh);display:flex;align-items:center;
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%}
.header-brand{display:flex;flex-direction:column;gap:1px}
.header-temple{font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-muted);line-height:1}
.header-title{font-family:var(--font-disp);font-size:20px;font-weight:600;color:var(--fg);line-height:1}
.header-right{display:flex;align-items:center;gap:14px;flex-shrink:0}

.lang-btns{display:flex;align-items:center}
.lang-btn{
  background:none;border:none;cursor:pointer;
  font-family:var(--font-body);font-size:12px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:var(--fg-muted);
  padding:6px 10px;transition:color .18s;min-height:44px;
}
.lang-btn+.lang-btn{border-left:1px solid var(--border)}
.lang-btn.active{color:var(--gold)}

.cart-fab{
  background:none;border:2px solid var(--border);
  color:var(--fg-2);width:40px;height:40px;
  border-radius:50%;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .18s,color .18s;position:relative;
}
.cart-fab:hover{border-color:var(--gold);color:var(--gold)}
.cart-count{
  position:absolute;top:-6px;right:-6px;
  background:var(--gold);color:#fff;
  font-size:10px;font-weight:700;min-width:18px;height:18px;
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  padding:0 4px;font-family:var(--font-body);
}

/* ── Hero ────────────────────────────────────────── */
.hero{
  background:var(--bg);
  padding:72px max(24px,env(safe-area-inset-left,0px)) 80px;
  text-align:center;border-bottom:2px solid var(--border);
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 70% at 50% 30%,rgba(168,120,24,0.07) 0%,transparent 70%);
  pointer-events:none;
}
.hero-eyebrow{
  font-family:var(--font-body);font-size:11px;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
  margin-bottom:20px;display:block;
}
.hero-h1{
  font-family:var(--font-disp);
  font-size:clamp(48px,8vw,88px);
  font-weight:300;color:var(--fg);
  letter-spacing:-.01em;line-height:1.0;margin-bottom:16px;
}
.hero-h1 em{font-style:italic;color:var(--gold);font-weight:300}
.hero-sub{
  font-family:var(--font-disp);font-style:italic;font-weight:300;
  font-size:clamp(16px,2.2vw,20px);color:var(--fg-2);
  margin-bottom:48px;max-width:440px;margin-inline:auto;
}
.hero-rule{width:40px;height:2px;background:var(--gold);margin:0 auto 36px;opacity:.6}
.hero-stats{display:flex;justify-content:center;max-width:460px;margin-inline:auto}
.stat-item{text-align:center;flex:1;padding:0 24px;border-right:1px solid var(--border)}
.stat-item:last-child{border-right:none}
.stat-num{font-family:var(--font-disp);font-size:44px;font-weight:300;color:var(--fg);line-height:1;display:block;margin-bottom:6px}
.stat-label{font-size:10px;font-weight:500;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.14em}

/* ── Page ────────────────────────────────────────── */
.page{padding-bottom:120px}
.page-inner{padding-inline:max(20px,env(safe-area-inset-left,0px));max-width:980px;margin:0 auto}

/* ── Section head ────────────────────────────────── */
.section-head{padding:40px 0 20px}
.section-head h2{
  font-family:var(--font-body);font-size:10px;font-weight:600;
  letter-spacing:.22em;text-transform:uppercase;color:var(--fg-muted);
}
.section-head .sub{font-size:13px;color:var(--fg-muted);margin-top:4px}

/* ── Category grid ───────────────────────────────── */
.cat-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
}
.cat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:28px 24px 26px;
  cursor:pointer;position:relative;
  box-shadow:var(--sh);
  transition:box-shadow .2s,transform .2s,border-color .2s;
}
.cat-card:hover{box-shadow:var(--sh-lg);transform:translateY(-2px);border-color:var(--border-h)}
.cat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:3px;background:var(--gold);border-radius:var(--r) var(--r) 0 0;
  opacity:0;transition:opacity .2s;
}
.cat-card:hover::before{opacity:1}
.cat-icon{font-size:28px;margin-bottom:14px;display:block;line-height:1}
.cat-name{font-family:var(--font-disp);font-size:22px;font-weight:600;color:var(--fg);margin-bottom:6px;line-height:1.2}
.cat-avail{font-size:12px;color:var(--fg-muted);letter-spacing:.04em}

/* ── Category page head ──────────────────────────── */
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:none;border:none;color:var(--fg-muted);
  font-family:var(--font-body);font-size:12px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;
  padding:28px 0 22px;cursor:pointer;transition:color .18s;
  min-height:44px;
}
.back-btn:hover{color:var(--gold)}
.cat-header{display:flex;align-items:baseline;gap:16px;margin-bottom:28px}
.cat-header-icon{font-size:28px;opacity:.6}
.cat-header-name{font-family:var(--font-disp);font-size:clamp(32px,5vw,50px);font-weight:600;color:var(--fg)}

/* Filter bar */
.filter-bar{display:flex;margin-bottom:24px;gap:0;flex-wrap:wrap}
.filter-btn{
  background:var(--surface);border:1px solid var(--border);
  color:var(--fg-muted);font-family:var(--font-body);font-size:12px;
  font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  padding:10px 18px;cursor:pointer;
  transition:all .18s;min-height:44px;
  margin-right:8px;margin-bottom:8px;border-radius:var(--r-sm);
}
.filter-btn.active{background:var(--gold);border-color:var(--gold);color:#fff}
.filter-btn:hover:not(.active){border-color:var(--border-h);color:var(--fg)}

/* Search */
.search-wrap{position:relative;margin-bottom:24px}
.search-inp{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);
  color:var(--fg);font-family:var(--font-body);font-size:16px;
  padding:12px 12px 12px 40px;outline:none;
  transition:border-color .18s;box-shadow:var(--sh);
}
.search-inp:focus{border-color:var(--gold);outline:2px solid rgba(168,120,24,0.18)}
.search-inp::placeholder{color:var(--fg-muted);opacity:.6}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-muted);font-size:16px}

/* ── Dish grid ───────────────────────────────────── */
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.dish-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--sh);
  transition:box-shadow .22s,transform .22s,border-color .22s;
}
.dish-card.booked-dish{opacity:.6}
.dish-card:not(.booked-dish):hover{box-shadow:var(--sh-lg);transform:translateY(-2px);border-color:var(--border-h)}
.dish-card.selected-dish{border-color:var(--gold);border-width:2px;box-shadow:0 0 0 3px rgba(168,120,24,0.18)}

/* Thumbnail area */
.dish-img{
  width:100%;aspect-ratio:4/3;object-fit:cover;cursor:pointer;display:block;
  transition:transform .36s;
}
.dish-card:not(.booked-dish):hover .dish-img{transform:scale(1.05)}
.dish-img-placeholder{
  width:100%;aspect-ratio:4/3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:42px;cursor:pointer;gap:8px;
}
.dish-img-placeholder .recipe-hint{
  font-size:11px;color:rgba(255,255,255,0.85);
  background:rgba(0,0,0,0.30);padding:3px 10px;border-radius:20px;
  font-family:var(--font-body);letter-spacing:.04em;
}

.dish-body{padding:14px 16px 18px;flex:1;display:flex;flex-direction:column;gap:8px}
.dish-num{font-size:10px;color:var(--fg-muted);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.dish-name{font-family:var(--font-disp);font-size:18px;font-weight:600;line-height:1.3;flex:1;color:var(--fg)}

.dish-status,.dish-badge{
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  align-self:flex-start;padding:3px 0;
}
.status-avail,.badge-avail{color:var(--avail)}
.status-booked,.badge-booked{color:var(--booked-c)}

.dish-actions{display:flex;gap:8px;margin-top:4px}
.btn-recipe{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--fg-muted);font-family:var(--font-body);font-size:11px;
  font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  padding:0 10px;height:44px;cursor:pointer;flex:1;
  border-radius:var(--r-sm);
  transition:border-color .18s,color .18s,background .18s;
}
.btn-recipe:hover{border-color:var(--border-h);color:var(--fg);background:var(--surface)}
.btn-select{
  background:var(--fg);border:1px solid var(--fg);
  color:var(--bg);font-family:var(--font-body);font-size:11px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:0 12px;height:44px;cursor:pointer;flex:2;
  border-radius:var(--r-sm);
  transition:background .18s,border-color .18s,color .18s;
}
.btn-select:hover:not(:disabled):not(.selected){background:var(--gold);border-color:var(--gold)}
.btn-select.selected{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-select:disabled{background:var(--bg-alt);border-color:var(--border);color:var(--fg-muted);cursor:not-allowed}

/* ── Floating cart ───────────────────────────────── */
.cart-float{
  position:fixed;
  bottom:max(28px,env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  background:var(--fg);color:var(--bg);border:none;
  padding:0 6px 0 22px;height:54px;
  display:flex;align-items:center;gap:16px;
  cursor:pointer;font-family:var(--font-body);
  box-shadow:0 8px 32px rgba(0,0,0,0.22);
  z-index:200;white-space:nowrap;border-radius:var(--r);
  transition:transform .2s,box-shadow .2s;
}
.cart-float:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.28)}
.cart-float-left{display:flex;flex-direction:column;gap:2px;flex:1}
.cart-float-name{font-size:13px;font-weight:600}
.cart-float-items{font-size:11px;opacity:.55;letter-spacing:.03em}
.cart-float-cta{
  background:var(--gold);color:#fff;
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:0 18px;height:100%;display:flex;align-items:center;flex-shrink:0;
  border-radius:0 var(--r) var(--r) 0;
}

/* ── Cart page ───────────────────────────────────── */
.cart-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.cart-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  box-shadow:var(--sh);
}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-family:var(--font-disp);font-size:18px;font-weight:600}
.cart-item-cat{font-size:12px;color:var(--fg-muted);margin-top:3px;letter-spacing:.04em}
.btn-remove{
  background:none;border:1px solid var(--booked-c);color:var(--booked-c);
  font-family:var(--font-body);font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  padding:8px 14px;min-height:40px;border-radius:var(--r-sm);
  transition:background .18s;flex-shrink:0;
}
.btn-remove:hover{background:var(--booked-bg)}
.cart-empty{text-align:center;padding:80px 20px;color:var(--fg-muted)}
.cart-empty-icon{font-size:36px;display:block;margin-bottom:20px;opacity:.4}

/* ── Registration form ───────────────────────────── */
.reg-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:40px;margin-bottom:32px;box-shadow:var(--sh-lg)}
.reg-form h2{font-family:var(--font-disp);font-size:32px;font-weight:600;margin-bottom:8px}
.reg-form .reg-note{font-size:14px;color:var(--fg-muted);margin-bottom:32px}
.form-group{margin-bottom:28px}
.form-group label{
  display:block;font-size:11px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--fg-muted);margin-bottom:10px;
}
.form-group input{
  width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--fg);font-family:var(--font-body);font-size:18px;
  padding:14px 16px;outline:none;transition:border-color .18s;
}
.form-group input:focus{border-color:var(--gold);outline:2px solid rgba(168,120,24,0.18)}
.form-group input::placeholder{color:var(--fg-muted);opacity:.45}
.btn-confirm{
  width:100%;background:var(--fg);border:none;color:var(--bg);
  font-family:var(--font-disp);font-size:22px;font-weight:600;
  padding:20px;cursor:pointer;letter-spacing:.04em;
  border-radius:var(--r);transition:background .18s;
}
.btn-confirm:hover:not(:disabled){background:var(--gold)}
.btn-confirm:disabled{background:var(--bg-alt);color:var(--fg-muted);cursor:not-allowed}
.form-error{
  background:var(--booked-bg);border:1px solid var(--booked-c);
  color:var(--booked-c);font-size:14px;padding:14px 16px;
  margin-bottom:20px;border-radius:var(--r-sm);line-height:1.5;
}
.reg-summary{border:1px solid var(--border);border-radius:var(--r-sm);padding:20px;margin-bottom:28px;background:var(--surface2)}
.reg-summary h3{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:14px}
.reg-summary-item{display:flex;align-items:baseline;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--border)}
.reg-summary-item:last-child{border-bottom:none}
.reg-summary-num{font-size:10px;color:var(--fg-muted);font-variant-numeric:tabular-nums;min-width:40px}

/* ── Success ─────────────────────────────────────── */
.success-wrap{text-align:center;padding:80px 20px}
.success-icon{font-size:52px;display:block;margin-bottom:24px}
.success-title{font-family:var(--font-disp);font-size:clamp(36px,6vw,64px);font-weight:300;color:var(--fg);margin-bottom:12px}
.success-sub{font-family:var(--font-disp);font-style:italic;font-weight:300;font-size:18px;color:var(--fg-2);margin-bottom:44px;max-width:400px;margin-inline:auto}
.success-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px;max-width:440px;margin:0 auto 44px;box-shadow:var(--sh);text-align:left}
.success-box h3{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:16px}
.success-dish{padding:10px 0;border-bottom:1px solid var(--border);font-family:var(--font-disp);font-size:17px;color:var(--fg)}
.success-dish:last-child{border-bottom:none}
.btn-home{
  background:var(--gold);border:none;color:#fff;
  font-family:var(--font-disp);font-size:20px;font-weight:600;
  padding:16px 44px;cursor:pointer;border-radius:var(--r);
  transition:background .18s;
}
.btn-home:hover{background:var(--fg)}

/* ── Recipe modal ────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-box{background:var(--surface);border-radius:var(--r);max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--sh-lg)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-head h3{font-family:var(--font-disp);font-size:24px;font-weight:600}
.modal-close{background:none;border:1px solid var(--border);color:var(--fg-muted);font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s}
.modal-close:hover{border-color:var(--fg);color:var(--fg)}
.modal-body{padding:24px}
.modal-img{width:100%;display:block;border-radius:var(--r-sm)}
.modal-no-img{text-align:center;padding:48px 20px;color:var(--fg-muted)}
.modal-no-img-icon{font-size:40px;display:block;margin-bottom:16px;opacity:.4}

/* ── Loading ─────────────────────────────────────── */
.loading-wrap{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.loading-spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-muted)}

/* ── Misc ────────────────────────────────────────── */
.no-results{text-align:center;padding:60px 20px;color:var(--fg-muted);font-size:14px;letter-spacing:.05em}

@media(max-width:600px){
  .hero{padding:56px max(16px,env(safe-area-inset-left,0px)) 64px}
  .hero-h1{font-size:42px}
  .stat-item{padding:0 16px}
  .stat-num{font-size:32px}
  .cat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .dish-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .reg-form{padding:24px}
  .cart-float{border-radius:28px}
}

/* ── Gallery ──────────────────────────────────────────────────── */
.gallery-section{padding:2.5rem 0;border-top:1px solid var(--border);margin-top:0}
.gallery-title{text-align:center;font-family:var(--font-disp);font-size:1.6rem;color:var(--gold);margin-bottom:.25rem}
.gallery-sub{text-align:center;color:var(--fg-muted);font-size:.9rem;margin-bottom:1.5rem}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gallery-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);cursor:zoom-in;transition:transform .2s,box-shadow .2s}
.gallery-img:hover{transform:scale(1.04);box-shadow:var(--sh-lg)}
.gallery-placeholder{width:100%;aspect-ratio:4/3;background:var(--bg-alt);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:var(--fg-muted);font-size:.75rem;border:1.5px dashed var(--border-h)}
.gallery-placeholder span{font-size:1.8rem}
.gallery-year{font-family:var(--font-disp);font-size:1.1rem;color:var(--fg-2);margin:1.25rem 0 .5rem;font-weight:600}
.gallery-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.gallery-lightbox img{max-width:100%;max-height:90vh;border-radius:var(--r);box-shadow:0 8px 40px rgba(0,0,0,.5)}
.gallery-lightbox-close{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── Confirmation actions ────────────────────────────────────── */
.confirm-actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.25rem}
.btn-wa{background:#25D366;color:#fff;border:none;border-radius:var(--r);padding:.65rem 1.1rem;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:.4rem;font-weight:600}
.btn-wa:hover{background:#1EBE5B}
.btn-email-info{background:var(--bg-alt);color:var(--fg-2);border:1px solid var(--border);border-radius:var(--r);padding:.65rem 1.1rem;font-size:.85rem;display:flex;align-items:center;gap:.4rem}

let currentCatId = null;
let currentFilter = 'all';
let currentPage = 'home';
let db = null;
let isSubmitting = false;
let unsubscribeFn = null;

/* ============================================================
   HELPERS
   ============================================================ */
const t = k => T[lang][k] || T.en[k] || k;
const byId = id => document.getElementById(id);
const cat = id => CATEGORIES.find(c=>c.id===id);
const dish = id => DISHES.find(d=>d.id===id);
const dishName = d => d[lang] || d.en;
const catName = c => c[lang] || c.en;

function totalDishes(catId){
  return catId ? DISHES.filter(d=>d.cat===catId).length : DISHES.length;
}
function availCount(catId){
  const list = catId ? DISHES.filter(d=>d.cat===catId) : DISHES;
  return list.filter(d=>!bookedMap[d.id]).length;
}

/* ============================================================
   LANGUAGE
   ============================================================ */
function setLang(l){
  lang = l;
  try{ localStorage.setItem('annakut_lang',l) }catch(e){}
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===l);
  });
  refreshAllText();
  if(currentPage==='cat') renderDishes();
  else if(currentPage==='cart') renderCart();
}

function refreshAllText(){
  const tt = T[lang];
  byId('hdr-temple').textContent = tt.temple;
  byId('hdr-title').textContent = tt.siteTitle;
  byId('hero-eyebrow').textContent = tt.heroEye;
  byId('hero-h1').textContent = tt.heroH1;
  byId('hero-sub').textContent = tt.heroSub;
  byId('stat-avail-lbl').textContent = tt.statAvail;
  byId('stat-booked-lbl').textContent = tt.statBooked;
  byId('stat-total-lbl').textContent = tt.statTotal;
  byId('sec-categories').textContent = tt.categories;
  byId('back-home-lbl').textContent = tt.backHome;
  byId('back-browse-lbl').textContent = tt.backBrowse;
  byId('back-cart-lbl').textContent = tt.backCart;
  byId('filter-all').textContent = tt.filterAll;
  byId('filter-avail').textContent = tt.filterAvail;
  byId('filter-booked').textContent = tt.filterBooked;
  byId('dish-search').placeholder = tt.searchPlaceholder;
  byId('cart-title').textContent = tt.cartTitle;
  byId('btn-to-register').textContent = tt.proceedReg;
  byId('reg-title').textContent = tt.regTitle;
  byId('lbl-name').textContent = tt.lblName;
  byId('lbl-phone').textContent = tt.lblPhone;
  byId('lbl-email').textContent = tt.lblEmail;
  byId('btn-confirm-seva').textContent = isSubmitting ? tt.submitting : tt.confirmBtn;
  byId('success-title').textContent = tt.successTitle;
  byId('success-sub').textContent = tt.successSub;
  byId('btn-back-home').textContent = tt.backHome2;
  byId('cf-cta').textContent = tt.proceedReg.split(' ')[0];
  updateStats();
  renderCategories();
  updateCartUI();
}

/* ============================================================
   STATS
   ============================================================ */
function updateStats(){
  const total = DISHES.length;
  const booked = Object.keys(bookedMap).length;
  const avail = total - booked;
  byId('stat-avail').textContent = avail;
  byId('stat-booked').textContent = booked;
  byId('stat-total').textContent = total;
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function showPage(name){
  ['home','cat','cart','register','success'].forEach(p=>{
    byId('page-'+p).hidden = (p!==name);
  });
  currentPage = name;
  window.scrollTo({top:0,behavior:'smooth'});
}

function goHome(){
  currentCatId = null;
  showPage('home');
  renderCategories();
}
function goCart(){
  if(!cart.length){ goHome(); return; }
  renderCart();
  showPage('cart');
}
function goRegister(){
  renderRegSummary();
  showPage('register');
}
function goBack(){
  if(currentCatId) showPage('cat');
  else goHome();
}

/* ============================================================
   CATEGORIES
   ============================================================ */
function renderCategories(){
  const grid = byId('cat-grid');
  grid.innerHTML = '';
  CATEGORIES.forEach(c=>{
    const av = availCount(c.id);
    const tot = totalDishes(c.id);
    const el = document.createElement('div');
    el.className = 'cat-card';
    el.style.setProperty('--cat-accent', c.color);
    el.onclick = ()=>openCategory(c.id);
    el.innerHTML = `
      <span class="cat-icon">${c.icon}</span>
      <div class="cat-name">${catName(c)}</div>
      <div class="cat-avail">${av}/${tot} ${t('statAvail').toLowerCase()}</div>`;
    grid.appendChild(el);
  });
}

function openCategory(id){
  currentCatId = id;
  currentFilter = 'all';
  byId('dish-search').value = '';
  const c = cat(id);
  byId('cat-hdr-icon').textContent = c.icon;
  byId('cat-hdr-name').textContent = catName(c);
  renderDishes();
  showPage('cat');
}

/* ============================================================
   DISHES
   ============================================================ */
function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.filter===f);
  });
  renderDishes();
}

function renderDishes(){
  const searchVal = (byId('dish-search')?.value||'').toLowerCase().trim();
  let list = DISHES.filter(d=>d.cat===currentCatId);

  if(currentFilter==='avail') list = list.filter(d=>!bookedMap[d.id]);
  if(currentFilter==='booked') list = list.filter(d=>bookedMap[d.id]);

  if(searchVal){
    list = list.filter(d=>{
      const n = dishName(d).toLowerCase();
      const enL = d.en.toLowerCase();
      return n.includes(searchVal)||enL.includes(searchVal);
    });
  }

  const grid = byId('dish-grid');
  const noRes = byId('no-results');
  grid.innerHTML = '';

  if(!list.length){
    noRes.hidden = false;
    noRes.textContent = t('noResults');
    return;
  }
  noRes.hidden = true;

  list.forEach(d=>{
    const booked = !!bookedMap[d.id];
    const sel = cart.includes(d.id);
    const imgUrl = RECIPE_IMAGES[d.id] || null;
    const c = cat(d.cat);

    const el = document.createElement('div');
    el.className = 'dish-card' + (booked?' booked-dish':'') + (sel?' selected-dish':'');

    const imgHtml = imgUrl
      ? `<img class="dish-img" src="${imgUrl}" alt="${dishName(d)}" loading="lazy" onclick="openRecipe('${d.id}')">`
      : `<div class="dish-img-placeholder" style="background:linear-gradient(135deg,${c.color}33,${c.color}66)" onclick="openRecipe('${d.id}')">
          ${c.icon}
          <span class="recipe-hint">📖 ${t('viewRecipe')}</span>
        </div>`;

    const badgeHtml = booked
      ? `<span class="dish-status status-booked">${t('dishBooked')}</span>`
      : `<span class="dish-status status-avail">${t('statAvail')}</span>`;

    const actHtml = booked
      ? `<button class="btn-recipe" onclick="openRecipe('${d.id}')">${t('viewRecipe')}</button>`
      : `<button class="btn-recipe" onclick="openRecipe('${d.id}')">${t('viewRecipe')}</button>
         <button class="btn-select ${sel?'selected':''}" onclick="toggleCart('${d.id}',this)">
           ${sel ? t('selected') : t('selectSeva')}
         </button>`;

    el.innerHTML = `
      ${imgHtml}
      <div class="dish-body">
        <div class="dish-num">#${d.sn}</div>
        <div class="dish-name">${dishName(d)}</div>
        ${badgeHtml}
        <div class="dish-actions">${actHtml}</div>
      </div>`;
    grid.appendChild(el);
  });
}

/* ============================================================
   CART
   ============================================================ */
function toggleCart(id, btn){
  const d = dish(id);
  if(!d) return;
  if(cart.includes(id)){
    cart = cart.filter(x=>x!==id);
  } else {
    cart.push(id);
  }
  updateCartUI();
  // Update this button immediately
  const inCart = cart.includes(id);
  if(btn){
    btn.textContent = inCart ? t('selected') : t('selectSeva');
    btn.classList.toggle('selected', inCart);
  }
  // Update dish card border
  const cards = document.querySelectorAll('.dish-card');
  // Re-render for accuracy
  renderDishes();
}

function updateCartUI(){
  const n = cart.length;
  byId('cart-count-badge').textContent = n;
  byId('cart-fab-btn').hidden = n===0;
  const floatBtn = byId('cart-float-btn');
  floatBtn.hidden = (n===0 || currentPage==='cart' || currentPage==='register' || currentPage==='success');
  if(n>0){
    byId('cf-items').textContent = cart.map(id=>{ const d=dish(id); return dishName(d);}).join(' · ').slice(0,56)+(cart.length>3?'…':'');
    byId('cf-count').textContent = `${n} ${n===1?'dish':'dishes'} selected`;
  }
}

function renderCart(){
  const list = byId('cart-list');
  if(!cart.length){
    list.innerHTML = `<div class="cart-empty"><span class="cart-empty-icon">🛒</span><div>${t('cartEmpty')}</div><div style="font-size:13px;margin-top:8px">${t('cartEmptySub')}</div></div>`;
    byId('btn-to-register').disabled = true;
    return;
  }
  byId('btn-to-register').disabled = false;
  list.innerHTML = '';
  cart.forEach(id=>{
    const d = dish(id);
    const c = cat(d.cat);
    const el = document.createElement('div');
    el.className = 'cart-item';
    el.innerHTML = `
      <div class="cart-item-info">
        <div class="cart-item-name">${dishName(d)}</div>
        <div class="cart-item-cat">${c.icon} ${catName(c)}</div>
      </div>
      <button class="btn-remove" onclick="removeFromCart('${id}')">${t('remove')}</button>`;
    list.appendChild(el);
  });
}

function removeFromCart(id){
  cart = cart.filter(x=>x!==id);
  updateCartUI();
  renderCart();
}

/* ============================================================
   REGISTRATION
   ============================================================ */
function renderRegSummary(){
  const s = byId('reg-summary');
  const title = `<h3>${t('regSummaryTitle')}</h3>`;
  const items = cart.map(id=>{
    const d = dish(id);
    const c = cat(d.cat);
    return `<div class="reg-summary-item"><span class="reg-summary-num">#${d.sn}</span><span>${dishName(d)} — ${catName(c)}</span></div>`;
  }).join('');
  s.innerHTML = title + items;
  byId('form-error').hidden = true;
}

async function submitBooking(){
  if(isSubmitting) return;
  const name = byId('inp-name').value.trim();
  const phone = byId('inp-phone').value.trim();
  const email = byId('inp-email').value.trim();
  const errEl = byId('form-error');
  errEl.hidden = true;

  if(!name||!phone||!email){
    errEl.textContent = 'Please fill in all required fields.';
    errEl.hidden = false;
    return;
  }
  if(!email.includes('@')){
    errEl.textContent = 'Please enter a valid email address.';
    errEl.hidden = false;
    return;
  }

  if(!db){
    errEl.textContent = 'Registration system loading. Please wait a moment and try again.';
    errEl.hidden = false;
    return;
  }

  isSubmitting = true;
  byId('btn-confirm-seva').disabled = true;
  byId('btn-confirm-seva').textContent = t('submitting');

  try {
    // Check all dishes still available (bookedMap is live from Firebase listener)
    const conflicts = [];
    for(const id of cart){
      if(bookedMap[id]) conflicts.push(id);
    }
    if(conflicts.length){
      const names = conflicts.map(id=>dishName(dish(id))).join(', ');
      errEl.textContent = t('alreadyBooked') + ` (${names})`;
      errEl.hidden = false;
      isSubmitting = false;
      byId('btn-confirm-seva').disabled = false;
      byId('btn-confirm-seva').textContent = t('confirmBtn');
      return;
    }

    // Write all bookings to Firebase
    const now = new Date().toISOString();
    const writes = cart.map(id =>
      db.child(id).set({ name, phone, email, bookedAt: now })
    );
    await Promise.all(writes);

    // Show success
    showSuccess(name, cart.slice());
    cart = [];
    updateCartUI();
  } catch(e){
    errEl.textContent = 'An error occurred. Please try again. ' + (e.message||'');
    errEl.hidden = false;
    isSubmitting = false;
    byId('btn-confirm-seva').disabled = false;
    byId('btn-confirm-seva').textContent = t('confirmBtn');
  }
}

/* ============================================================
   RECIPE MODAL
   ============================================================ */
function openRecipe(id){
  const d = dish(id);
  byId('modal-dish-name').textContent = dishName(d);
  const body = byId('modal-body');
  const imgUrl = RECIPE_IMAGES[id];
  if(imgUrl){
    body.innerHTML = `<img class="modal-img" src="${imgUrl}" alt="${dishName(d)}">`;
  } else {
    body.innerHTML = `<div class="modal-no-img">
      <span class="modal-no-img-icon">📖</span>
      <p>${t('noRecipeImg')}</p>
    </div>`;
  }
  byId('modal-recipe').hidden = false;
}

function closeModal(e){
  if(!e || e.target===byId('modal-recipe') || e.currentTarget===byId('modal-recipe')){
    byId('modal-recipe').hidden = true;
  }
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ byId('modal-recipe').hidden = true; byId('gallery-lightbox').hidden = true; } });
// Gallery lightbox
document.addEventListener('click', e=>{
  if(e.target.classList.contains('gallery-img')){
    byId('lightbox-img').src = e.target.src;
    byId('gallery-lightbox').hidden = false;
  }
});

/* ============================================================
   DATABASE — Shared booking state
   ============================================================ */
async function initDB(){
  try {
    if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY'){
      byId('loading-text').textContent = 'Firebase not configured. See setup guide in HTML file.';
      return;
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    const fbRef = firebase.database().ref('annakut2026');
    db = fbRef; // db is now the Firebase ref
    // Load initial data, then switch to live listener
    await new Promise(resolve => {
      fbRef.once('value', snap => {
        bookedMap = snap.val() || {};
        fbRef.on('value', livesnap => {
          bookedMap = livesnap.val() || {};
          updateStats();
          if(currentPage==='cat') renderDishes();
          if(currentPage==='home') renderCategories();
          updateCartUI();
        });
        resolve();
      });
    });
  } catch(e){
    console.warn('DB init error:', e);
  }
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  // Restore language preference
  try{
    const saved = localStorage.getItem('annakut_lang');
    if(saved && T[saved]) lang = saved;
  }catch(e){}

  // Set active lang button
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===lang);
  });

  // Apply all text
  refreshAllText();
  updateStats();

  // Init DB
  await initDB();

  // Remove loading overlay
  const overlay = byId('loading-overlay');
  overlay.style.transition = 'opacity .4s';
  overlay.style.opacity = '0';
  setTimeout(()=>{ overlay.hidden = true; }, 400);

  // Show initial page
  showPage('home');
})();

// Gallery lightbox
document.addEventListener('click', e => {
  if(e.target.classList.contains('gallery-img')){
    byId('lightbox-img').src = e.target.src;
    byId('gallery-lightbox').hidden = false;
  }
});

</script>
