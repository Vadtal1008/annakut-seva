body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.55}

    yours:'आपके व्यंजन',remove:'हटाएँ',name:'पूरा नाम',phone:'फ़ोन नंबर',phoneHelp:'ज़रूरत होने पर ही फ़ोन करेंगे।',email:'ईमेल (वैकल्पिक)',emailHelp:'पुष्टि ईमेल से भेजेंगे।',
    confirm:'मेरी सेवा दर्ज करें',sending:'दर्ज हो रहा है…',more:'← और व्यंजन चुनें',max:n=>'अधिकतम '+n+' व्यंजन चुन सकते हैं।',
    taken2:'क्षमा करें, ये व्यंजन अभी किसी और ने चुन लिए। इन्हें आपकी सूची से हटा दिया गया:',
    okT:'जय स्वामिनारायण! आपकी सेवा दर्ज हो गई है।',okRef:'आपका नंबर',okShot:'कृपया इस पेज का स्क्रीनशॉट ले लें।',again:'और व्यंजन चुनें',
    close:'बंद करें',ing:'सामग्री',method:'बनाने की विधि',note:'नोट',time:'समय',serves:'मात्रा',noRec:'इस व्यंजन की रेसिपी अभी उपलब्ध नहीं है।',
    loading:'रेसिपी खुल रही है…',transl:'अनुवाद हो रहा है…',failed:'रेसिपी नहीं खुली। इंटरनेट जाँचें और फिर कोशिश करें।',
    notOpen:'पंजीकरण जल्द शुरू होगा। तब तक व्यंजन और रेसिपी देख सकते हैं।',err:'कुछ गलत हुआ। फिर कोशिश करें।',total:(a,b)=>b+' में से '+a+' व्यंजन बाकी'}
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let DISHES=[], BY={}, booked=new Set(), hiNames=store.get('hiNames',null), guRec=null, recCache={};
let lang=store.get('lang','en'), sel=new Set(store.get('sel',[])), view={v:'home'}, q='';
const t = () => T[lang];

async function api(fn, args){
  if(!CONFIG.API) throw new Error('offline');
  const r = await fetch(CONFIG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'error');
  return j.data;
}
function nameOf(d){
  if(lang==='gu') return [d[1], d[2]];
  if(lang==='hi') return [(hiNames&&hiNames[d[0]])||d[1], d[2]];
  return [d[2], d[1]];
}
function catName(c){return c[{en:1,gu:2,hi:3}[lang]]}
function saveSel(){store.set('sel',[...sel])}

function renderChrome(){
  document.documentElement.lang = lang;
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang));
  $('#t-sub').textContent = t().sub + (CONFIG.DATE ? ' · '+CONFIG.DATE : '');
  const step = view.v==='form'?2:view.v==='done'?3:1;
  $('#steps').innerHTML = [t().s1,t().s2,t().s3].map((s,i)=>`<li class="${i+1===step?'on':''}"${i+1===step?' aria-current="step"':''}><b>${i+1}</b>${esc(s)}</li>`).join('');
  $('#foot').textContent = (CONFIG.HELP||'') + (CONFIG.HELP?' · ':'') + 'Shree Swaminarayan Mandir, Vadtal Dham Edmonton';
  const showTray = sel.size>0 && view.v!=='form' && view.v!=='done';
  $('#tray').hidden = !showTray;
  if(showTray){ $('#tray-t').textContent=t().nsel(sel.size); $('#tray-go').textContent=t().cont; }
  $('#dlg-x').textContent = t().close;
}

function card(d){
  const [a,b]=nameOf(d), isSel=sel.has(d[0]), off=booked.has(d[0])&&!isSel;
  return `<article class="dish${isSel?' sel':''}${off?' off':''}">
    <div class="ph"><img src="img/${d[0]}.webp" alt="${esc(d[2])}" loading="lazy" width="360" height="270"><span class="no">#${d[0]}</span>
    ${off?`<span class="tag taken">${esc(t().taken)}</span>`:isSel?`<span class="tag mine">${esc(t().mine)}</span>`:''}</div>
    <div class="body"><h3>${esc(a)}</h3><p class="alt">${esc(b)}</p>
    <div class="acts"><button class="btn ghost" data-rec="${d[0]}">${esc(t().recipe)}</button>
    <button class="btn${isSel?' done':''}" data-pick="${d[0]}"${off?' disabled':''} aria-pressed="${isSel}">${esc(off?t().taken:isSel?t().selected:t().select)}</button></div></div></article>`;
}

function searchBox(){
  return `<div class="search"><label for="q">${esc(t().search)}</label><input id="q" type="search" autocomplete="off" placeholder="${esc(t().searchPh)}" value="${esc(q)}"></div>`;
}
function matches(){
  const s=q.trim().toLowerCase(); if(!s) return [];
  return DISHES.filter(d=>String(d[0])===s || d[2].toLowerCase().includes(s) || d[1].includes(s) || (hiNames&&(hiNames[d[0]]||'').includes(s))).slice(0,60);
}

function render(focus){
  renderChrome();
  const app=$('#app'); let h='';
  if(view.v==='home'){
    const open=DISHES.filter(d=>!booked.has(d[0])).length;
    h = searchBox() + `<div id="res">${resultsHtml()}</div>`;
  } else if(view.v==='cat'){
    const c=CATS.find(c=>c[0]===view.c), ds=DISHES.filter(d=>d[3]===view.c);
    h = `<div class="bar"><button class="back" data-go="home">${esc(t().back)}</button></div>
      <h2>${esc(catName(c))}</h2><p class="lead">${esc(t().total(ds.filter(d=>!booked.has(d[0])).length, ds.length))}</p>
      <div class="list">${ds.map(card).join('')}</div>`;
  } else if(view.v==='form'){
    const ds=[...sel].map(n=>BY[n]).filter(Boolean);
    h = `<div class="bar"><button class="back" data-go="home">${esc(t().more)}</button></div>
      <h2>${esc(t().yours)}</h2><div class="chosen">${ds.map(d=>{const [a,b]=nameOf(d);return `<div class="row"><img src="img/${d[0]}.webp" alt=""><div><b>#${d[0]} · ${esc(a)}</b><small>${esc(b)}</small></div><button data-rm="${d[0]}">${esc(t().remove)}</button></div>`}).join('')}</div>
      ${view.msg?`<p class="msg ${view.msgType||'err'}" role="alert">${view.msg}</p>`:''}
      ${CONFIG.API?'':`<p class="msg info">${esc(t().notOpen)}</p>`}
      <form id="f" novalidate>
        <div class="field"><label for="fn">${esc(t().name)}</label><input id="fn" name="name" autocomplete="name" required value="${esc(store.get('me',{}).name||'')}"></div>
        <div class="field"><label for="fp">${esc(t().phone)}</label><input id="fp" name="phone" type="tel" inputmode="tel" autocomplete="tel" required value="${esc(store.get('me',{}).phone||'')}"><small>${esc(t().phoneHelp)}</small></div>
        <div class="field"><label for="fe">${esc(t().email)}</label><input id="fe" name="email" type="email" inputmode="email" autocomplete="email" value="${esc(store.get('me',{}).email||'')}"><small>${esc(t().emailHelp)}</small></div>
        <button class="btn" type="submit" id="fs"${CONFIG.API&&ds.length?'':' disabled'}>${esc(t().confirm)}</button>
      </form>`;
  } else if(view.v==='done'){
    h = `<div class="ok-box" role="status"><h2>${esc(t().okT)}</h2><p>${esc(t().okRef)}:</p><p class="ref">${esc(view.ref)}</p>
      <div class="chosen">${view.list.map(n=>{const d=BY[n],[a,b]=nameOf(d);return `<div class="row"><img src="img/${n}.webp" alt=""><div><b>#${n} · ${esc(a)}</b><small>${esc(b)}</small></div><button data-rec="${n}">${esc(t().recipe)}</button></div>`}).join('')}</div>
      <p>${esc(t().okShot)}</p><button class="btn" data-go="home">${esc(t().again)}</button></div>`;
  }
  app.innerHTML=h;
  if(focus){ app.focus({preventScroll:true}); window.scrollTo(0,0); }
}
function resultsHtml(){
  if(q.trim()){ const m=matches(); return m.length?`<div class="list">${m.map(card).join('')}</div>`:`<p class="empty">${esc(t().noMatch)}</p>`; }
  return `<h2>${esc(t().pick)}</h2><p class="lead">${esc(t().pickLead)}</p><div class="cats">${CATS.map(c=>{
    const ds=DISHES.filter(d=>d[3]===c[0]), open=ds.filter(d=>!booked.has(d[0])).length;
    return `<button class="cat" data-cat="${c[0]}"><img src="img/${c[4]}.webp" alt="" loading="lazy"><div><span>${esc(catName(c))}</span><small>${ds.length} ${esc(t().dishes)} · ${open} ${esc(t().open)}</small></div></button>`}).join('')}</div>`;
}

async function openRecipe(sn, rl){
  const d=BY[sn], dlg=$('#dlg'); rl = rl || (lang);
  $('#dlg-t').textContent = '#'+sn+' · '+nameOf(d)[0];
  const tabs=`<div class="tabs" role="tablist">${[['en','English'],['gu','ગુજરાતી'],['hi','हिंदी']].map(([k,l])=>`<button role="tab" data-rl="${k}" data-sn="${sn}" aria-selected="${k===rl}">${l}</button>`).join('')}</div>`;
  const top=`<img class="hero" src="img/${sn}.webp" alt="${esc(d[2])}">${tabs}`;
  const body=$('#dlg-b');
  if(!dlg.open) dlg.showModal();
  body.innerHTML = top + `<p><span class="spin"></span>${esc(rl==='gu'?t().loading:t().transl)}</p>`;
  try{
    let r;
    if(!guRec){ guRec = await (await fetch('data/recipes-gu.json')).json(); }
    const g=guRec[sn];
    if(!g || !g.steps.length){ body.innerHTML = top + `<p class="empty">${esc(t().noRec)}</p>`; return; }
    let L=T[rl], warn='';
    if(rl==='gu') r=g;
    else {
      const k=sn+':'+rl;
      try { r = recCache[k] || (recCache[k] = await api('getRecipe',[sn,rl])); }
      catch(e){ r=g; L=T.gu; warn=`<p class="msg info">${esc(T[rl].failed)}</p>`; }
    }
    if(stale(sn,rl)) return;
    body.innerHTML = top + warn + `<h2 style="margin-top:0">${esc(r.t)}</h2>
      <div class="meta">${r.time?`<span>${esc(L.time)}: ${esc(r.time)}</span>`:''}${r.serves?`<span>${esc(L.serves)}: ${esc(r.serves)}</span>`:''}</div>
      <h3>${esc(L.ing)}</h3><ul>${r.ing.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      <h3>${esc(L.method)}</h3><ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
      ${r.note?`<p class="note"><b>${esc(L.note)}:</b> ${esc(r.note)}</p>`:''}`;
  }catch(e){ if(!stale(sn,rl)) body.innerHTML = top + `<p class="msg err">${esc(t().failed)}</p>`; }
}
function stale(sn,rl){ const b=$('#dlg-b'); return Number(b.dataset.sn)!==sn || b.dataset.rl!==rl; }
function setRec(sn,rl){ const b=$('#dlg-b'); b.dataset.sn=sn; b.dataset.rl=rl; openRecipe(sn,rl); }

function toggle(sn){
  if(sel.has(sn)) sel.delete(sn);
  else { if(sel.size>=CONFIG.MAX){ alertMax(); return; } sel.add(sn); }
  saveSel();
  const scroll=window.scrollY; render(); window.scrollTo(0,scroll);
}
function alertMax(){ const p=document.createElement('p'); p.className='msg info'; p.setAttribute('role','alert'); p.textContent=t().max(CONFIG.MAX); $('#app').prepend(p); setTimeout(()=>p.remove(),4000); }

async function submit(e){
  e.preventDefault();
  const f=e.target, form={name:f.name.value.trim(),phone:f.phone.value.trim(),email:f.email.value.trim(),dishes:[...sel]};
  store.set('me',{name:form.name,phone:form.phone,email:form.email});
  const b=$('#fs'); b.disabled=true; b.textContent=t().sending;
  try{
    const r=await api('book',[form]);
    if(!r.ok){
      r.conflicts.forEach(n=>{sel.delete(n);booked.add(n)}); saveSel();
      view={v:'form',msg:esc(t().taken2)+' '+r.conflicts.map(n=>'#'+n+' '+esc(nameOf(BY[n])[0])).join(', ')}; render(true); return;
    }
    r.dishes.forEach(n=>booked.add(n)); sel.clear(); saveSel();
    view={v:'done',ref:r.ref,list:r.dishes}; render(true);
  }catch(err){
    view={v:'form',msg:esc(err.message==='offline'?t().notOpen:(/[a-z]/i.test(err.message)&&lang==='en'?err.message:t().err))}; render(true);
  }
}

async function refreshBooked(){
  try{ booked=new Set(await api('getBooked',[])); if(view.v==='home'||view.v==='cat'){const y=window.scrollY;render();window.scrollTo(0,y);} }catch{}
}
async function loadHi(){
  if(hiNames||!CONFIG.API) return;
  try{ hiNames=await api('getNames',['hi']); store.set('hiNames',hiNames); render(); }catch{}
}

document.addEventListener('click',e=>{
  const x=e.target.closest('button'); if(!x) return;
  if(x.dataset.lang){ lang=x.dataset.lang; store.set('lang',lang); if(lang==='hi') loadHi(); render(); return; }
  if(x.dataset.cat){ view={v:'cat',c:+x.dataset.cat}; q=''; render(true); return; }
  if(x.dataset.go){ view={v:x.dataset.go}; render(true); return; }
  if(x.dataset.pick){ toggle(+x.dataset.pick); return; }
  if(x.dataset.rec){ setRec(+x.dataset.rec, lang); return; }
  if(x.dataset.rl){ setRec(+x.dataset.sn, x.dataset.rl); return; }
  if(x.dataset.rm){ sel.delete(+x.dataset.rm); saveSel(); view={v:'form'}; render(); return; }
  if(x.id==='tray-go'){ view={v:'form'}; render(true); return; }
  if(x.id==='dlg-x'){ $('#dlg').close(); return; }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ q=e.target.value; $('#res').innerHTML=resultsHtml(); } });
document.addEventListener('submit',e=>{ if(e.target.id==='f') submit(e); });
$('#dlg').addEventListener('click',e=>{ if(e.target.id==='dlg') e.target.close(); });

(async function init(){
  renderChrome();
  $('#app').innerHTML='<p><span class="spin"></span>Loading…</p>';
  DISHES = await (await fetch('data/dishes.json')).json();
  DISHES.forEach(d=>BY[d[0]]=d);
  [...sel].forEach(n=>{ if(!BY[n]) sel.delete(n); }); saveSel();
  render();
  refreshBooked(); setInterval(refreshBooked, 60000);
  if(lang==='hi') loadHi();
})();
</script>
</body>
</html>
