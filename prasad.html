<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Annakut Prasad Delivery</title>
<meta property="og:title" content="Annakut Prasad - Home Delivery">
<meta property="og:description" content="Share your address so we can deliver the Annakut prasad to your home.">
<meta property="og:image" content="https://vadtal1008.github.io/annakut-seva/img/og.jpg">
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;600&display=swap">
<style>
:root{--m9:#33070f;--m7:#721325;--gold:#d4a64a;--gold-l:#f6e2a4;--ivory:#fdf8ef;--ink:#2b1a12;--muted:#6f5d50;--line:#ecdfc9;--ok:#2e7d4f;--bad:#b3261e;color-scheme:light}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:Poppins,'Noto Sans Gujarati',system-ui,sans-serif;line-height:1.5}
header{background:linear-gradient(180deg,var(--m7),var(--m9));color:#fff;text-align:center;padding:18px max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left));border-bottom:2px solid var(--gold)}
header img{max-width:240px;width:70%;height:auto}
header h1{margin:8px 0 0;font-size:1.35rem;color:var(--gold-l);text-wrap:balance}
main{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 30px -18px rgba(51,7,15,.35)}
p.gu{color:var(--muted);margin-top:0}
label{display:block;font-weight:600;margin:16px 0 6px}
label small{font-weight:400;color:var(--muted)}
input,textarea{width:100%;font:inherit;color:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:52px}
input:focus,textarea:focus{outline:3px solid var(--gold-l);border-color:var(--gold)}
button{margin-top:22px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--m7);color:#fff;font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:14px;font-weight:600}
.msg.bad{color:var(--bad)}
.done{text-align:center}
.done b{display:block;font-size:1.3rem;color:var(--ok);margin-bottom:6px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 30px}
</style>
</head>
<body>
<header>
  <img src="img/logo-wide.webp" alt="Shree Hindu Swaminarayan Temple - Vadtaldham Edmonton">
  <h1>Annakut Prasad - Home Delivery<br>અન્નકૂટ પ્રસાદ - ઘરે પહોંચાડવા માટે</h1>
</header>
<main>
  <div class="card" id="box">
    <p>Please share your address so we can deliver the Annakut prasad to your home.</p>
    <p class="gu">આપના ઘરે અન્નકૂટનો પ્રસાદ પહોંચાડવા માટે કૃપા કરીને આપનું સરનામું આપો.</p>
    <form id="f" novalidate>
      <label for="name">Full name <small>/ પૂરું નામ</small></label>
      <input id="name" autocomplete="name" required maxlength="80">
      <label for="phone">Phone number <small>/ ફોન નંબર</small></label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="16">
      <label for="address">Home address with postal code <small>/ પોસ્ટલ કોડ સાથે ઘરનું સરનામું</small></label>
      <textarea id="address" rows="3" autocomplete="street-address" required maxlength="300"></textarea>
      <label for="notes">Notes, e.g. buzzer or best time <small>(optional / વૈકલ્પિક)</small></label>
      <input id="notes" maxlength="200">
      <button id="go">Send my address / સરનામું મોકલો</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>
<footer>Shree Hindu Swaminarayan Temple - Vadtaldham Edmonton</footer>
<script>
const API = 'https://script.google.com/macros/s/AKfycbyRY0_dSN0dptVP5b5wbytYk2CkH3DB-amCWZSygSmlWHoijpe9dImNG6Vr9V_ds9kA/exec';
const $ = id => document.getElementById(id);
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const v = { name: $('name').value.trim(), phone: $('phone').value.trim(), address: $('address').value.trim(), notes: $('notes').value.trim() };
  const err = v.name.length < 3 ? 'Please enter your full name.' : v.phone.replace(/\D/g, '').length < 10 ? 'Please enter a valid phone number.' : v.address.length < 10 ? 'Please enter your full address.' : '';
  if (err) { $('msg').className = 'msg bad'; $('msg').textContent = err; return; }
  $('go').disabled = true; $('msg').className = 'msg'; $('msg').textContent = 'Sending...';
  try {
    const r = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ fn: 'prasadAddress', args: [v] }) })).json();
    if (!r.ok) throw new Error(r.error);
    $('box').innerHTML = '<div class="done"><b>Thank you, Jay Swaminarayan 🙏</b>We have your address and will bring the prasad to your home.<p class="gu">આભાર. અમે આપના ઘરે પ્રસાદ પહોંચાડીશું.</p></div>';
  } catch (x) {
    $('msg').className = 'msg bad'; $('msg').textContent = (x.message || 'Something went wrong.') + ' Please try again.'; $('go').disabled = false;
  }
});
</script>
</body>
</html>
